name: "Update news on owasp-juice.shop"

on:
  release:
    types: [ published ]

jobs:
  UpdateNewsOnWebsite:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
    - name: Check out Git repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #v4.2.2
      with:
        token: ${{ secrets.BOT_TOKEN }}
        repository: juice-shop/juice-shop.github.io
        branch: master
    - name: Update tab_news.md
      env:
        TAG_NAME: ${{ github.event.release.tag_name }}
        PUBLISHED_AT: ${{ github.event.release.published_at }}
      run: |
        if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
          echo "::error::Release tag name is not a valid version (expected vX.Y.Z[-suffix])"
          exit 1
        fi
        if [[ ! "$PUBLISHED_AT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]; then
          echo "::error::Release publication date is not a valid ISO 8601 timestamp"
          exit 1
        fi
        entry="* ${PUBLISHED_AT}: juice-shop [\`${TAG_NAME}\`](https:\/\/github.com\/juice-shop\/juice-shop\/releases\/tag\/${TAG_NAME})"
        sed -i "s/<!-- next:juice-shop -->/<!-- next:juice-shop -->\n${entry}/" tab_news.md
    - uses: stefanzweifel/git-auto-commit-action@8621497c8c39c72f3e2a999a26b4ca1b5058a842 #v5.0.1
      with:
        commit_message: "Add juice-shop ${{ github.event.release.tag_name }} release notes to tab_news.md"
        branch: master
        commit_options: '--signoff'

        # Optional commit user and author settings
        commit_user_name: JuiceShopBot
        commit_user_email: 61591748+JuiceShopBot@users.noreply.github.com
        commit_author: JuiceShopBot <61591748+JuiceShopBot@users.noreply.github.com>
