fixes:
  - id: 1
    explanation: 'Getting rid of the /ftp folder entirely is the only way to plumb this data leakage for good. Valid static content in it needs to be moved to a more suitable location and order confirmation PDFs had no business to be placed there publicly accessible in the first place. Everything else in that folder was just accidentally put & forgotten there anyway.'
  - id: 2
    explanation: 'Removing only the route for quarantined files will still allow attackers to download any other individual file if they can come up with a valid file name.'
  - id: 3
    explanation: 'Replacing the routes that serve individual files with a directory listing is likely to plumb the data leak but still provides information to the attacker unnecessarily.'
  - id: 4
    explanation: "Bringing back the directory listing, even with its icons switched off, makes it even easier to browse and access the files."
hints:
  - "Can you identify one or more routes which have something to do with file serving?"
  - "Did you notice that there are separate routes for retrieving public and quarantined files?"
  - "Make sure to select the line responsible for the data leakage."
