fixes:
  - id: 1
    explanation: "Dropping the field selection entirely keeps the password hash out of the response, but it also removes a feature clients rely on instead of making it safe to use."
  - id: 2
    explanation: "Deleting the password from the response is a blocklist approach: it only covers the one attribute someone thought of, while other sensitive attributes of the user record - like the TOTP secret or the deluxe token - remain requestable."
  - id: 3
    explanation: "Only attributes on the allowlist of non-sensitive fields can be requested, so neither the password hash nor any other confidential attribute added to the user model later can leak through this endpoint."
  - id: 4
    explanation: "Masking the value still confirms the existence of the attribute and leaves every other sensitive attribute of the user record exposed to the field selection."
hints:
  - "Consider which user attributes are safe to hand out and who decides that in this code."
  - "The endpoint lets the client pick the attributes of the user record it wants to see."
  - "Nothing restricts the requested field names to the harmless subset of the user model before they are copied into the response."
