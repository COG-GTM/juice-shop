fixes:
  - id: 1
    explanation: 'There should generally be no good reason to expose server logs through a web URL of the server itself, epecially not when that server is Internet-facing.'
  - id: 2
    explanation: "Switching off the detailed view option is a cosmetic change on the directory listing but still allows the logs to be browsed and accessed by anyone holding an administrator token."
  - id: 3
    explanation: 'Removing the route that serves individual log files plumbs the data leak, but the remaining directory listing still exposes log metadata through the web server, relying solely on administrator authentication to keep it private.'
  - id: 4
    explanation: 'Removing only the directory listing still leaves individual log files downloadable through the web server, so a single stolen or leaked administrator token is enough to obtain every logged request.'
hints:
  - "Can you identify one or more routes which have something to do with log files?"
  - "Did you spot the directory listing clearly linked to log files?"
  - "Did you notice that there is a seperate route for retrieving individual log files?"
  - "Make sure to select both lines responsible for the log file data leakage."
